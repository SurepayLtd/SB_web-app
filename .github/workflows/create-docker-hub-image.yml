name: Build and Push Docker Image

on:
  push:
    branches: [surepay-dev]
  pull_request:
    branches: [surepay-dev]

# Cancel in-progress runs on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: hero78/surepayfrontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Set a reasonable timeout to prevent hanging builds
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Only fetch the latest commit
          fetch-tags: false # Don't fetch tags unless needed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js cache
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64 # Build for a single platform initially
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_REGISTRY_URL=https://registry.npmjs.org/
            BUILD_ENVIRONMENT_OPTIONS=--configuration production
            PUPPETEER_DOWNLOAD_HOST_ARG=https://storage.googleapis.com
            PUPPETEER_CHROMIUM_REVISION_ARG=1011831
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Add output caching to speed up builds
          outputs: type=docker,dest=/tmp/image.tar

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
