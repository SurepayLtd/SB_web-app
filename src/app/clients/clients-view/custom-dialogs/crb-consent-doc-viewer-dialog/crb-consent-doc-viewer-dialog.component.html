<div class="doc-viewer">

  <!-- Header -->
  <div class="doc-viewer__header">
    <div class="doc-viewer__titles">
      <h3>{{ data.title }}</h3>
      <small *ngIf="data.subtitle">{{ data.subtitle }}</small>
    </div>

    <div class="doc-viewer__actions">
      <button mat-stroked-button type="button" (click)="download()">
        <mat-icon>download</mat-icon>
        Download
      </button>

      <button mat-stroked-button type="button" (click)="print()">
        <mat-icon>print</mat-icon>
        Print
      </button>

      <button mat-icon-button type="button" (click)="close()" matTooltip="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- PDF viewer -->
  <div class="doc-viewer__body">
    <iframe
      [src]="safeUrl"
      title="CRB consent document"
      type="application/pdf"
      class="doc-viewer__frame">
    </iframe>
  </div>

  <!-- Footer -->
  <div class="doc-viewer__footer">
    <mat-icon inline>info</mat-icon>
    If the document does not display, use the <strong>Download</strong> button to open it in your PDF viewer.
  </div>
</div>
