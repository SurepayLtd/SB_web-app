<h2 mat-dialog-title>{{ data.title | translate }}</h2>

<mat-dialog-content>
  <p>{{ data.message | translate }}</p>

  <form [formGroup]="otpForm" (ngSubmit)="submit()">
    <mat-form-field fxFlex>
      <mat-label>{{ 'OTP' | translate }}</mat-label>

      <input matInput formControlName="otp" autocomplete="one-time-code" required />

      <mat-error *ngIf="otpForm.controls.otp.hasError('required')">
        {{ 'OTP is required' | translate }}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    {{ 'Cancel' | translate }}
  </button>

  <button mat-raised-button color="primary" type="button" [disabled]="otpForm.invalid" (click)="submit()">
    {{ 'Validate' | translate }}
  </button>
</mat-dialog-actions>
